name: Node CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Build Typescript
      run: npm run build

    - name: Run tests
      run: npm test
